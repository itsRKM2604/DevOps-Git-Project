<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Registration</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #141e30, #243b55);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 800px;
        background: white;
        padding: 2rem;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      .title {
        text-align: center;
        margin-bottom: 1.5rem;
        color: #243b55;
      }

      form {
        margin-bottom: 2rem;
      }

      .form-group {
        margin-bottom: 1rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: bold;
        color: #333;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
        transition: 0.3s;
        font-size: 15px;
      }

      input:focus {
        border-color: #243b55;
        box-shadow: 0 0 5px rgba(36, 59, 85, 0.4);
      }

      button {
        width: 100%;
        padding: 12px;
        background: #243b55;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #1b2d42;
      }

      .message {
        text-align: center;
        margin-bottom: 1rem;
        color: green;
        font-weight: bold;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 10px;
      }

      table th {
        background: #243b55;
        color: white;
        padding: 12px;
        text-align: left;
      }

      table td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
      }

      table tr:nth-child(even) {
        background: #f7f7f7;
      }

      table tr:hover {
        background: #eef3f8;
      }

      .table-title {
        margin-bottom: 1rem;
        color: #243b55;
      }

      @media (max-width: 600px) {
        .container {
          padding: 1rem;
        }

        table {
          font-size: 14px;
        }

        input,
        button {
          font-size: 14px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1 class="title">User Registration Form</h1>

      {% if msg %}
      <div class="message">{{ msg }}</div>
      {% endif %}

      <form action="/" method="post">
        <div class="form-group">
          <label for="name">Full Name</label>

          <input
            type="text"
            name="name"
            id="name"
            placeholder="Enter your full name"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            name="email"
            id="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <button type="submit">Save User</button>
      </form>

      {% if data %}

      <h2 class="table-title">Saved Users</h2>

      <table>
        <tr>
          <th>Created At</th>
          <th>Name</th>
          <th>Email</th>
        </tr>

        {% for item in data %}
        <tr>
          <td>{{ item.created_at }}</td>
          <td>{{ item.fullname }}</td>
          <td>{{ item.email }}</td>
        </tr>
        {% endfor %}
      </table>

      {% endif %}
    </div>
  </body>
</html>
